# Quality checks for every PR and every push to main.
# Deployment is handled by Vercel's Git integration, not here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run it replaces. Runs on main are never
# cancelled, so every commit on main gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: CI only checks code, it never writes to the repo.
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Separate steps so the PR check shows which kind of failure it was.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
